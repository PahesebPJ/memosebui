name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Git tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Check versions, typecheck, build and test
        run: |
          node scripts/check-versions.mjs
          npm run typecheck
          npm run build
          npm test

      - name: Smoke test packed tarball
        run: |
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          npm install -g --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP/$TARBALL"
          "$RUNNER_TEMP/global/bin/memosebui" --version
          MEMOSEB_DB_PATH="$RUNNER_TEMP/vault.sqlite" "$RUNNER_TEMP/global/bin/memosebui" status --json

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
