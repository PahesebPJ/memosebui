name: release-desktop

# Builds the Tauri shell + Node SEA sidecar installers on every platform and uploads them as
# workflow artifacts. On a published Release, a separate job attaches them to that Release.
on:
  workflow_dispatch:
  release:
    types: [published]

# The build job runs npm/cargo build scripts, so it only ever gets a read-only token. Write access
# is granted solely to attach-to-release, which runs no project code.
permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # SEA cannot cross-compile, so each macOS architecture needs its own runner.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The sidecar embeds this exact runtime; keep it on an LTS line.
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Check versions
        run: node scripts/check-versions.mjs

      # beforeBuildCommand (npm run build:sidecar) produces the SEA binary for this runner.
      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          args: --target ${{ matrix.target }}

      # Runs after the build: tauri-build requires the sidecar binary to exist.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Smoke-test the sidecar binary
        shell: bash
        run: |
          bin="src-tauri/binaries/memosebui-server-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version
          node scripts/smoke-sidecar.mjs "$bin"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memosebui-desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: memosebui-desktop-*
          path: installers

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # Only installer types are uploaded: anything else a compromised build dependency dropped
        # into the artifacts is ignored. SHA256SUMS lets users verify the unsigned installers.
        run: |
          set -euo pipefail
          mkdir upload
          find installers -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} upload/ \;
          ls -l upload
          test -n "$(ls upload)"
          (cd upload && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" upload/* --clobber --repo "$GITHUB_REPOSITORY"
