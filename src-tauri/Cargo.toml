[package]
name = "memosebui-desktop"
version = "0.1.1"
description = "Native desktop shell for memosebui (Tauri 2 + Node SEA sidecar)"
authors = ["PahesebPJ"]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "memosebui-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
