<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>memosebui</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --err: #c0392b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --err: #ff6b5e; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      main { text-align: center; max-width: 34rem; padding: 0 16px; }
      .logo { font-size: 48px; }
      .muted { color: var(--muted); }
      .error { color: var(--err); white-space: pre-wrap; text-align: left; font-family: ui-monospace, monospace; font-size: 13px; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">🧠</div>
      <p id="status" class="muted">Iniciando el visor neuronal…</p>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="loading.js"></script>
  </body>
</html>
